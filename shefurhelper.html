
<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <title>Helper Page</title>
  <meta name="description" content="SheFur Project & Canon. By HyenaLoL.">
  <link rel="stylesheet" href="AssetsSP/CSSSP/shefurhelper-style.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#814e00">

</head>

<body>

  <div class="container">
  <main>

    <section id="shefurhelper-footer-by">
      <footer class="footer-by">By HyenaLoL</footer>
    </section>

    <div class="lang-switch">
      <button onclick="setLang('en')">EN</button>
      <button onclick="setLang('ru')">RU</button>
    </div>

    <section id="shefurhelper-nav-home">
      <nav>
        <a href="index.html">Home</a>
      </nav>
    </section>

    <section id="kirra-png">
      <div class="shefur-kirra-img-container">
        <img src="AssetsSP/IMGSP/SheFur-KiRra-PAGE.png" alt="SheFur KiRra Helper">
      </div>
      <div class="simple-space"></div>
    </section>

  </main>

  <section id="shefur-shefurhelper-rights">
    <footer class="shefurhelper-footer-rights">© 2026 SheFur Project - by HyenaLoL - All rights reserved.</footer>
  </section>

  <button id="scrollDown" class="scroll-btn">▼</button>
  <button id="scrollUp" class="scroll-btn">▲</button>
  </div>

  <script src="AssetsSP/JSSP/shefurhelper-script.js"></script>

    <script>
    function setLang(lang) {
      if (lang === 'ru') {
        document.body.classList.add('ru');
      } else {
      document.body.classList.remove('ru');
      }
    }
  </script>

</body>
</html>
